<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ÉduRénov · Défis de l’innovation, solutions lauréates</title>
<meta name="description" content="Les solutions lauréates des Défis de l’innovation du programme ÉduRénov." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F6F5F4;
    --surface: #FFFFFF;
    --ink: #2A2420;
    --muted: #6F645D;
    --faint: #9A8F88;
    --line: #E6E1DD;
    --line-strong: #CFC7C1;
    --brand-red: #E3241B;
    --brand-grey: #857369;
    --trophy-ink: #7A5500;
    --trophy-tint: #FBF2DA;
    --focus: #1D5FD1;
    --radius: 12px;
    --header-h: 72px;
    --page-max: 2240px;
    --gutter: clamp(16px, 3.5vw, 64px);
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --font-body: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  html { scroll-padding-top: calc(var(--header-h) + 72px); }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── En-tête ── */
  .site-header {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .site-header-inner {
    max-width: var(--page-max); margin: 0 auto;
    padding: 12px var(--gutter);
    display: flex; align-items: center; justify-content: space-between; gap: 16px 24px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .brand img { height: 46px; width: auto; display: block; }
  .brand-sep { width: 1px; height: 32px; background: var(--line); }
  .brand-title {
    font-family: var(--font-display);
    font-weight: 600; font-size: 22px; line-height: 1.1;
    letter-spacing: 0.005em;
  }

  .session-switch { display: flex; align-items: center; gap: 10px; }
  .session-switch-label { font-size: 14px; color: var(--muted); }
  .segmented {
    display: inline-flex; padding: 3px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .segmented button {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 7px;
    font-size: 15px; font-weight: 600; color: var(--muted);
    white-space: nowrap;
  }
  .segmented button:hover { color: var(--ink); }
  .segmented button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 1px 2px rgba(42,36,32,.12), 0 0 0 1px var(--line);
  }
  .soon-tag {
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--surface); border: 1px solid var(--line);
    padding: 0 7px; border-radius: 999px; line-height: 18px;
  }
  .segmented button[aria-pressed="true"] .soon-tag { background: var(--bg); }

  /* ── Contenu ── */
  main { flex: 1; width: 100%; max-width: var(--page-max); margin: 0 auto; padding: clamp(28px, 3vw, 56px) var(--gutter) clamp(48px, 4vw, 80px); }

  .intro {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px 48px; align-items: end;
    padding-bottom: 28px; border-bottom: 1px solid var(--line);
  }
  .intro h1 {
    font-family: var(--font-display);
    font-weight: 600; font-size: clamp(32px, 3.6vw, 64px); line-height: 1.02;
    letter-spacing: -0.005em;
  }
  .intro h1::before {
    content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
    background: var(--brand-red); margin-bottom: 18px;
  }
  .intro p { margin-top: 12px; max-width: 60ch; color: var(--muted); font-size: 17px; }

  .stats { display: flex; gap: 0; list-style: none; }
  .stats li { padding: 0 24px; border-left: 1px solid var(--line); }
  .stats li:first-child { padding-left: 0; border-left: 0; }
  .stats strong {
    display: block; font-family: var(--font-display);
    font-weight: 600; font-size: clamp(28px, 2.4vw, 44px); line-height: 1;
  }
  .stats span { font-size: 14px; color: var(--muted); }

  /* Barre de filtres */
  .toolbar {
    position: sticky; top: var(--header-h); z-index: 20;
    background: var(--bg);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px;
    padding: 16px 0;
    margin-bottom: 8px;
  }
  .toolbar.is-stuck { box-shadow: 0 1px 0 var(--line); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    font-size: 15px; color: var(--ink);
  }
  .chip:hover { border-color: var(--line-strong); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); }
  .chip .count { color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip[aria-pressed="true"] .count { color: rgba(255,255,255,.65); }
  .chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
  .chip-sep { width: 1px; height: 24px; background: var(--line); align-self: center; margin: 0 4px; }
  .chip svg { width: 16px; height: 16px; flex: none; }
  .chip.trophy-toggle[aria-pressed="true"] { background: var(--trophy-tint); border-color: #E8D29A; color: var(--trophy-ink); }
  .chip.trophy-toggle[aria-pressed="true"] .count { color: var(--trophy-ink); opacity: .7; }

  .search { position: relative; flex: 0 1 280px; min-width: 200px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 34px 0 36px;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  }
  .search input::placeholder { color: var(--faint); }
  .search input:hover { border-color: var(--line-strong); }
  .search input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(29,95,209,.15); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%;
    display: none; align-items: center; justify-content: center; color: var(--muted);
  }
  .search-clear:hover { background: var(--bg); color: var(--ink); }
  .search.has-value .search-clear { display: inline-flex; }
  .search-clear svg { position: static; transform: none; width: 14px; height: 14px; color: currentColor; }

  /* Sections par thématique */
  .theme { margin-top: clamp(28px, 2.6vw, 48px); }
  .theme-head {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px;
    margin-bottom: 16px;
  }
  .theme-head h2 {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.15;
  }
  .theme-icon {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--tint); color: var(--c);
    align-self: center;
  }
  .theme-icon svg { width: 17px; height: 17px; }
  .theme-head .theme-count { font-size: 15px; color: var(--faint); }
  .theme-head p { flex-basis: 100%; color: var(--muted); font-size: 15px; padding-left: 40px; }

  .grid {
    display: grid; gap: clamp(12px, 1.1vw, 22px);
    grid-template-columns: repeat(auto-fill, minmax(clamp(190px, 13.5vw, 290px), 1fr));
  }

  .card {
    display: flex; flex-direction: column; text-align: left;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover { border-color: var(--line-strong); box-shadow: 0 4px 16px rgba(42,36,32,.07); }
  .card:focus-visible { outline-offset: 3px; }
  .card-logo {
    height: clamp(100px, 7.5vw, 156px); display: flex; align-items: center; justify-content: center;
    padding: clamp(12px, 1vw, 20px) clamp(16px, 1.5vw, 28px); border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .card-logo img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
  .card-body { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; }
  .card-name { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .card-summary {
    font-size: 14px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot { margin-top: auto; padding-top: 8px; }

  .trophy {
    display: inline-flex; align-items: flex-start; gap: 6px;
    background: var(--trophy-tint); color: var(--trophy-ink);
    font-size: 13px; font-weight: 600; line-height: 1.35;
    padding: 5px 9px; border-radius: 7px;
  }
  .trophy svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }

  /* États vides */
  .empty {
    margin-top: 32px; padding: 56px 24px;
    background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius);
    text-align: center;
  }
  .empty svg { width: 36px; height: 36px; color: var(--faint); margin-bottom: 12px; }
  .empty h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin-bottom: 6px; }
  .empty p { color: var(--muted); max-width: 48ch; margin: 0 auto; }
  .empty .btn { margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--surface);
    font-size: 15px; font-weight: 600;
  }
  .btn:hover { border-color: var(--ink); }

  /* ── Pied de page ── */
  .site-footer { border-top: 1px solid var(--line); background: var(--surface); }
  .site-footer-inner {
    max-width: var(--page-max); margin: 0 auto; padding: 20px var(--gutter);
    display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
    font-size: 14px; color: var(--muted);
  }
  .site-footer img { height: 34px; width: auto; display: block; }

  /* ── Fiche détaillée ── */
  .dialog-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(32,26,22,.45);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility .18s;
  }
  .dialog-backdrop.open { opacity: 1; visibility: visible; }
  .dialog {
    width: 100%; max-width: clamp(560px, 48vw, 860px); max-height: calc(100dvh - 48px);
    background: var(--surface); border-radius: 16px;
    box-shadow: 0 24px 64px rgba(32,26,22,.25);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(8px); transition: transform .18s ease;
  }
  .dialog-backdrop.open .dialog { transform: none; }
  .dialog-head {
    display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center;
    padding: 24px 24px 20px; border-bottom: 1px solid var(--line);
  }
  .dialog-logo {
    width: 148px; height: 84px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .dialog-logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .dialog-title { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.05; }
  .dialog-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .theme-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 7px;
    background: var(--tint); color: var(--c);
  }
  .theme-tag svg { width: 14px; height: 14px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
    align-self: start;
  }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  .dialog-body { padding: 22px 24px 8px; overflow-y: auto; }
  .dialog-body .lead { font-size: 16px; line-height: 1.65; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0 16px; }
  .fact { background: var(--bg); border-radius: 10px; padding: 14px 16px; }
  .fact h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .fact h3 svg { width: 14px; height: 14px; }
  .fact p { font-size: 15px; line-height: 1.5; }

  .dialog-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 24px; border-top: 1px solid var(--line);
    font-size: 14px; color: var(--muted);
  }
  .pager { display: flex; gap: 8px; }
  .pager .btn { height: 34px; padding: 0 12px; font-size: 14px; }
  .pager .btn svg { width: 15px; height: 15px; }
  .pager .btn:disabled { opacity: .4; cursor: default; border-color: var(--line); }

  body.modal-open { overflow: hidden; }

  /* ── Responsive ── */
  @media (max-width: 860px) {
    .intro { grid-template-columns: 1fr; align-items: start; }
  }
  @media (max-width: 640px) {
    :root { --header-h: 112px; }
    .site-header-inner { padding: 10px 16px; }
    .brand img { height: 38px; }
    .brand-title { font-size: 19px; }
    .session-switch { width: 100%; }
    .session-switch-label { display: none; }
    .segmented { width: 100%; }
    .segmented button { flex: 1; justify-content: center; }
    main { padding: 28px 16px 48px; }
    .stats li { padding: 0 16px; }
    .stats strong { font-size: 28px; }
    .search { flex: 1 1 100%; }
    .toolbar { position: static; padding-top: 20px; }
    .chip-sep { display: none; }
    .theme-head p { padding-left: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card-logo { height: 96px; padding: 14px 16px; }
    .dialog-backdrop { padding: 0; align-items: flex-end; }
    .dialog { max-width: none; max-height: 92dvh; border-radius: 16px 16px 0 0; }
    .dialog-head { grid-template-columns: 1fr auto; padding: 18px 16px 16px; }
    .dialog-logo { grid-column: 1; grid-row: 1; width: 128px; height: 72px; }
    .dialog-head > div:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
    .dialog-head .icon-btn { grid-column: 2; grid-row: 1; }
    .dialog-title { font-size: 26px; }
    .dialog-body { padding: 18px 16px 8px; }
    .facts { grid-template-columns: 1fr; }
    .dialog-foot { padding: 12px 16px; }
    .pager .btn .lbl { display: none; }
  }

  /* Tablettes */
  @media (min-width: 641px) and (max-width: 1024px) {
    .search { flex: 1 1 240px; }
  }
  /* Mobiles : filtres sur une ligne qui défile, cartes sur deux colonnes */
  @media (max-width: 640px) {
    .filters {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      width: calc(100% + 2 * var(--gutter)); margin: 0 calc(-1 * var(--gutter));
      padding: 2px var(--gutter);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--gutter), #000 calc(100% - var(--gutter)), transparent 100%);
              mask-image: linear-gradient(90deg, transparent 0, #000 var(--gutter), #000 calc(100% - var(--gutter)), transparent 100%);
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card-logo { height: 84px; padding: 10px 12px; }
    .card-body { padding: 10px 12px 12px; gap: 4px; }
    .card-name { font-size: 15px; }
    .card-summary { font-size: 13px; -webkit-line-clamp: 5; }
    .trophy { font-size: 12px; padding: 4px 7px; }
    .stats { flex-wrap: wrap; row-gap: 12px; }
    .intro p { font-size: 16px; }
  }
  /* Écrans peu hauts (mobile en paysage) : rien de collant */
  @media (max-height: 520px) and (orientation: landscape) {
    .site-header, .toolbar { position: static; }
    .dialog-backdrop { padding: 12px; align-items: center; }
    .dialog { max-height: calc(100dvh - 24px); border-radius: 16px; }
  }
  /* Grands écrans : texte légèrement plus grand pour rester lisible à distance */
  @media (min-width: 1800px) {
    body { font-size: 17px; }
    .brand img { height: 54px; }
    .brand-title { font-size: 26px; }
    .segmented button, .chip, .search input, .btn { font-size: 16px; }
    .chip, .search input { height: 40px; }
    .search { flex-basis: 340px; }
    .intro p { font-size: 19px; }
    .stats span { font-size: 15px; }
    .theme-head h2 { font-size: 30px; }
    .theme-head p, .theme-head .theme-count { font-size: 16px; }
    .card-name { font-size: 18px; }
    .card-summary { font-size: 15px; }
    .trophy { font-size: 14px; }
    .card-body { padding: 16px 18px 18px; }
    .dialog-title { font-size: 34px; }
    .dialog-body .lead { font-size: 17px; }
    .fact p { font-size: 16px; }
    .dialog-logo { width: 172px; height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-header" id="site-header">

/* ════════════════════════════════════════════════════════════════════
   ICÔNES
   ════════════════════════════════════════════════════════════════════ */
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  home: svg('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  leaf: svg('<path d="M11 20A7 7 0 0 1 4 13c0-6 6-9 16-9 0 10-3 16-9 16z"/><path d="M4 21c4-6 8-9 12-11"/>'),
  drop: svg('<path d="M12 3s7 7.6 7 12a7 7 0 0 1-14 0c0-4.4 7-12 7-12z"/>'),
  bolt: svg('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'),
  school: svg('<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>'),
  wind: svg('<path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h18"/>'),
  award: svg('<circle cx="12" cy="9" r="6"/><path d="m8.5 14.2-1.5 7.8 5-3 5 3-1.5-7.8"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  left: svg('<path d="m15 18-6-6 6-6"/>'),
  right: svg('<path d="m9 18 6-6-6-6"/>'),
  pin: svg('<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>'),
  building: svg('<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>'),
  calendar: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),

/* ════════════════════════════════════════════════════════════════════
   ÉTAT ET OUTILS
   ════════════════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = (t) => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’']/g, "'").toLowerCase();
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;

const defaultSession = [...SESSIONS].reverse().find((s) => s.status === 'published') || SESSIONS[0];
const state = { sessionId: defaultSession.id, theme: 'all', trophiesOnly: false, query: '' };
let visible = [];      // solutions affichées, dans l’ordre
let current = -1;      // index de la fiche ouverte
let lastFocus = null;

const session = () => SESSIONS.find((s) => s.id === state.sessionId) || defaultSession;
const themeOf = (s, id) => s.themes.find((t) => t.id === id);
const themeStyle = (t) => `--c:${t.color};--tint:${t.tint}`;
const logoImg = (sol) => LOGOS[sol.logo] ? `<img src="${LOGOS[sol.logo]}" alt="Logo ${esc(sol.name)}" />` : '';

/* ════════════════════════════════════════════════════════════════════
   RENDU
   ════════════════════════════════════════════════════════════════════ */
function renderSwitch() {
  $('#session-switch').innerHTML = SESSIONS.map((s) => `
    <button type="button" data-session="${s.id}" aria-pressed="${s.id === state.sessionId}">
      ${esc(s.label)}${s.status === 'upcoming' ? '<span class="soon-tag">à venir</span>' : ''}
    </button>`).join('');
}

function renderIntro() {
  const s = session();
  const trophies = s.solutions.filter((x) => x.trophy).length;
  const stats = s.status === 'published' ? `
    <ul class="stats">
      <li><strong>${s.solutions.length}</strong><span>lauréats</span></li>
      <li><strong>${s.themes.length}</strong><span>thématiques</span></li>
      ${trophies ? `<li><strong>${trophies}</strong><span>trophées</span></li>` : ''}
    </ul>` : '';
  $('#intro').innerHTML = `<div><h1>${esc(s.title)}</h1><p>${esc(s.intro)}</p></div>${stats}`;
}

function renderToolbar() {
  const s = session();
  const bar = $('#toolbar');
  if (s.status !== 'published') { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  const count = (id) => s.solutions.filter((x) => id === 'all' || x.theme === id).length;
  const trophyCount = s.solutions.filter((x) => x.trophy && (state.theme === 'all' || x.theme === state.theme)).length;
  bar.innerHTML = `
    <div class="filters" role="group" aria-label="Filtrer les solutions">
      <button type="button" class="chip" data-theme="all" aria-pressed="${state.theme === 'all'}">Toutes <span class="count">${count('all')}</span></button>
      ${s.themes.map((t) => `
        <button type="button" class="chip" data-theme="${t.id}" style="${themeStyle(t)}" aria-pressed="${state.theme === t.id}">
          <span class="dot" aria-hidden="true"></span>${esc(t.label)} <span class="count">${count(t.id)}</span>
        </button>`).join('')}
      <span class="chip-sep" aria-hidden="true"></span>
      <button type="button" class="chip trophy-toggle" data-trophies aria-pressed="${state.trophiesOnly}">
        ${ICONS.award}Trophées <span class="count">${trophyCount}</span>
      </button>
    </div>
    <div class="search ${state.query ? 'has-value' : ''}">
      ${ICONS.search}
      <label class="sr-only" for="q">Rechercher une solution</label>
      <input id="q" type="search" placeholder="Rechercher un lauréat" value="${esc(state.query)}" autocomplete="off" />
      <button type="button" class="search-clear" data-clear aria-label="Effacer la recherche">${ICONS.x}</button>
    </div>`;
}

function matches(sol) {
  if (state.theme !== 'all' && sol.theme !== state.theme) return false;
  if (state.trophiesOnly && !sol.trophy) return false;
  if (!state.query) return true;
  const hay = norm([sol.name, sol.summary, sol.description, sol.company, sol.rex, sol.trophy].join(' '));
  return norm(state.query).split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}

function renderResults() {
  const s = session();
  const out = $('#results');
  visible = [];

  if (s.status !== 'published') {
    out.innerHTML = `
      <div class="empty">
        ${ICONS.calendar}
        <h2>Lauréats à venir</h2>
        <p>${esc(s.upcomingText || 'Les thématiques et les solutions lauréates de cette session seront publiées ici à l’issue du jury.')}</p>
      </div>`;
    return;
  }

  const blocks = s.themes
    .filter((t) => state.theme === 'all' || t.id === state.theme)
    .map((t) => {
      const sols = s.solutions.filter((x) => x.theme === t.id && matches(x))
        .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
      if (!sols.length) return '';
      const start = visible.length;
      visible.push(...sols);
      return `
        <section class="theme" style="${themeStyle(t)}" aria-labelledby="h-${t.id}">
          <div class="theme-head">
            <h2 id="h-${t.id}"><span class="theme-icon">${ICONS[t.icon] || ''}</span>${esc(t.label)}</h2>
            <span class="theme-count">${plural(sols.length, 'solution', 'solutions')}</span>
            ${t.description ? `<p>${esc(t.description)}</p>` : ''}
          </div>
          <div class="grid">
            ${sols.map((sol, i) => `
              <button type="button" class="card" data-index="${start + i}" aria-haspopup="dialog">
                <span class="card-logo">${logoImg(sol)}</span>
                <span class="card-body">
                  <span class="card-name">${esc(sol.name)}</span>
                  <span class="card-summary">${esc(sol.summary)}</span>
                  ${sol.trophy ? `<span class="card-foot"><span class="trophy">${ICONS.award}${esc(sol.trophy)}</span></span>` : ''}
                </span>
              </button>`).join('')}
          </div>
        </section>`;
    }).join('');

  out.innerHTML = blocks || `
    <div class="empty">
      ${ICONS.noresult}
      <h2>Aucune solution trouvée</h2>
      <p>${state.query ? `Aucun lauréat ne correspond à « ${esc(state.query)} » avec ces filtres.` : 'Aucun lauréat ne correspond à ces filtres.'}</p>
      <button type="button" class="btn" data-reset>Réinitialiser les filtres</button>
    </div>`;
}

function render({ toolbar = true } = {}) {
  renderSwitch();
  renderIntro();
  if (toolbar) renderToolbar();
  renderResults();
  document.title = `ÉduRénov · ${session().title}`;
}

/* ════════════════════════════════════════════════════════════════════
   FICHE DÉTAILLÉE
   ════════════════════════════════════════════════════════════════════ */
function fillDialog() {
  const sol = visible[current];
  const t = themeOf(session(), sol.theme);
  $('#dialog').innerHTML = `
    <div class="dialog-head">
      <div class="dialog-logo">${logoImg(sol)}</div>
      <div>
        <h2 class="dialog-title" id="dialog-title">${esc(sol.name)}</h2>
        <div class="dialog-tags">
          ${t ? `<span class="theme-tag" style="${themeStyle(t)}">${ICONS[t.icon] || ''}${esc(t.label)}</span>` : ''}
          ${sol.trophy ? `<span class="trophy">${ICONS.award}${esc(sol.trophy)}</span>` : ''}
        </div>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Fermer la fiche">${ICONS.x}</button>
    </div>
    <div class="dialog-body">
      <p class="lead">${esc(sol.description)}</p>
      <div class="facts">
        ${sol.rex ? `<div class="fact"><h3>${ICONS.pin}Retour d’expérience</h3><p>${esc(sol.rex)}</p></div>` : ''}
        ${sol.company ? `<div class="fact"><h3>${ICONS.building}Entreprise</h3><p>${esc(sol.company)}</p></div>` : ''}
      </div>
    </div>
    <div class="dialog-foot">
      <span>${current + 1} sur ${visible.length}</span>
      <div class="pager">
        <button type="button" class="btn" data-step="-1" ${current === 0 ? 'disabled' : ''} aria-label="Solution précédente">${ICONS.left}<span class="lbl">Précédente</span></button>
        <button type="button" class="btn" data-step="1" ${current === visible.length - 1 ? 'disabled' : ''} aria-label="Solution suivante"><span class="lbl">Suivante</span>${ICONS.right}</button>
      </div>
    </div>`;
}

function openDialog(index) {
  current = index;
  lastFocus = document.activeElement;
  fillDialog();
  $('#dialog-backdrop').classList.add('open');
  document.body.classList.add('modal-open');
  $('#dialog').focus();
}
function closeDialog() {
  $('#dialog-backdrop').classList.remove('open');
  document.body.classList.remove('modal-open');
  current = -1;
  if (lastFocus) lastFocus.focus();
}
function step(d) {
  const n = current + d;
  if (n < 0 || n >= visible.length) return;
  current = n; fillDialog();
  const card = document.querySelector(`.card[data-index="${n}"]`);
  if (card) lastFocus = card;
}

/* ════════════════════════════════════════════════════════════════════
   INTERACTIONS
   ════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b?.dataset.session) {
    if (b.dataset.session !== state.sessionId) {
      Object.assign(state, { sessionId: b.dataset.session, theme: 'all', trophiesOnly: false, query: '' });
      history.replaceState(null, '', `#${state.sessionId}`);
      render();
    }
    return;
  }
  if (b?.dataset.theme) { state.theme = b.dataset.theme; render(); return; }
  if (b?.hasAttribute('data-trophies')) { state.trophiesOnly = !state.trophiesOnly; render(); return; }
  if (b?.hasAttribute('data-clear')) { state.query = ''; render(); $('#q')?.focus(); return; }
  if (b?.hasAttribute('data-reset')) { Object.assign(state, { theme: 'all', trophiesOnly: false, query: '' }); render(); return; }
  if (b?.classList.contains('card')) { openDialog(Number(b.dataset.index)); return; }
  if (b?.hasAttribute('data-close')) { closeDialog(); return; }
  if (b?.dataset.step) { step(Number(b.dataset.step)); return; }
  if (e.target.id === 'dialog-backdrop') closeDialog();
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.query = e.target.value;
  e.target.parentElement.classList.toggle('has-value', !!state.query);
  renderResults();
  // met à jour les compteurs sans reconstruire le champ (garde le curseur)
});

document.addEventListener('keydown', (e) => {
  if (current < 0) return;
  if (e.key === 'Escape') { e.preventDefault(); closeDialog(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Tab') {
    const f = [...$('#dialog').querySelectorAll('button:not([disabled])')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === $('#dialog'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// Session dans l’URL (#s1-2026) pour partager un lien direct
function readHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (SESSIONS.some((s) => s.id === id) && id !== state.sessionId) {
    Object.assign(state, { sessionId: id, theme: 'all', trophiesOnly: false, query: '' });
    render();
  }
}
window.addEventListener('hashchange', readHash);

// Hauteur réelle de l’en-tête pour la barre de filtres collante
const header = $('#site-header');
new ResizeObserver(() => document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px')).observe(header);
const toolbar = $('#toolbar');
window.addEventListener('scroll', () => {
  toolbar.classList.toggle('is-stuck', toolbar.getBoundingClientRect().top <= header.offsetHeight + 0.5 && window.scrollY > 0);
}, { passive: true });

document.getElementById('footer-logo').src = document.querySelector('.brand img').src;
render();
readHash();
</script>
</body>
